name: npm publish
description: reusable npm workflow for this project

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (the package will not be published)'
        default: false
        type: boolean
      version:
        description:
          'Version to publish (leave empty to use package.json version)'
        default: ''
        type: string
      tag:
        description: 'npm publish tag (e.g., latest, nightly)'
        default: ''
        type: string

jobs:
  npm-publish:
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/publish-npm.yml@1f9f07ab7380426fd6b59c32baa352a89e8a479b # publish-npm-v1.7.1
    with:
      working-directory: cli
      install-command: npm ci
      build-command: npm run build
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      environment: ${{ (inputs.dry-run && '') || inputs.tag }}
      provenance: ${{ !inputs.dry-run }}
