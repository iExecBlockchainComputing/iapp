name: CLI PR checks
on:
  pull_request:
    paths: ['cli/**']

permissions: {}

concurrency:
  group: ${{ github.ref }}-cli-pr-checks
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cli/npm-shrinkwrap.json'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Check format
        working-directory: cli
        run: npm run check-format

      - name: Lint
        working-directory: cli
        run: npm run lint

      - name: Install iapp cli
        working-directory: cli
        run: |
          npm i -g .
          iapp -h

      - name: Test
        working-directory: cli
        run: |
          npm run test

  npm-dry-run:
    uses: ./.github/workflows/reusable-cli-npm.yml
    # publish-npm requests these permissions statically, even in dry-run
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      dry-run: true
